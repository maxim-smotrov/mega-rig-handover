# Publishes the review preview to GitHub Pages (ADR 0003). The page is rendered here and
# deployed as a Pages artifact, so the HTML never lands in the repo. Manual only: run it with
# the LANE_MARKER repo variable set for review, then delete the variable and run it again to
# upload the clean copy over the same link.
name: preview

on:
  workflow_dispatch:
    inputs:
      path:
        description: rig page to publish
        default: /digest/2026-10-28

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm preview "$PREVIEW_PATH" var/preview/index.html
        env:
          PREVIEW_PATH: ${{ inputs.path }}
          LANE_MARKER: ${{ vars.LANE_MARKER }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: var/preview
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
